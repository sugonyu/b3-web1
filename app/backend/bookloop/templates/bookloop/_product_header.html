<header class="product-header">
  <h1 class="product-logo">BookLoop</h1>
  <div class="product-account" aria-label="Signed-in user">
    {% if current_user.is_authenticated %}
      <span>{{ current_user.username }} {{ user_icon(current_user) }} · User #{{ current_user.id }}</span>
      <a href="{{ url_for('jinja_client.user_profile', user_id=current_user.id) }}">Profile</a>
      <form action="{{ url_for('auth.logout') }}" method="post">
        <button type="submit">Log out</button>
      </form>
    {% else %}
      <span>Guest</span>
      <a href="{{ url_for('auth.login') }}">Log in</a>
      <a href="{{ url_for('auth.register') }}">Register</a>
    {% endif %}
  </div>
</header>
{% include "bookloop/_product_subtitle.html" %}
