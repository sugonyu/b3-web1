<div class="language-picker">
  <label for="bookloop-language" data-i18n="languageLabel">Language</label>
  <select id="bookloop-language" data-bookloop-language aria-describedby="bookloop-language-help">
    <option value="en" data-i18n="languageEnglish">English</option>
    <option value="ko" data-i18n="languageKorean">Korean</option>
    <option value="fr" data-i18n="languageFrench">French</option>
  </select>
  <span class="sr-only" id="bookloop-language-help" data-i18n="languageHelp">Translate fixed UI text. Your book data stays unchanged.</span>
</div>
