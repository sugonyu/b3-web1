<nav class="product-nav" aria-label="BookLoop product navigation">
  <a
    href="{{ url_for('jinja_client.product_home') }}"
    {% if request.endpoint == 'jinja_client.product_home' %}aria-current="page"{% endif %}
  >📚 Books</a>
  <a
    href="{{ url_for('jinja_client.borrower_request_history') }}"
    {% if request.endpoint == 'jinja_client.borrower_request_history' %}aria-current="page"{% endif %}
  >🙋 Sent requests</a>
  <a
    href="{{ url_for('jinja_client.listing_owner_request_history') }}"
    {% if request.endpoint == 'jinja_client.listing_owner_request_history' %}aria-current="page"{% endif %}
  >📬 Received requests</a>
  {% if current_user.is_authenticated and current_user.is_admin %}
    <a
      href="{{ url_for('admin.dashboard') }}"
      {% if request.blueprint == 'admin' %}aria-current="page"{% endif %}
    >🚩 Received reports</a>
  {% else %}
    <a
      href="{{ url_for('jinja_client.report_history') }}"
      {% if request.endpoint == 'jinja_client.report_history' %}aria-current="page"{% endif %}
    >🚩 My reports</a>
  {% endif %}
</nav>
