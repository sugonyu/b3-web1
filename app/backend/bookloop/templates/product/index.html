<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello BookLoop</title>
    <link rel="icon" href="{{ url_for('static', filename='web/python-favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='web/style.css') }}">
  </head>
  <body>
    <main>
      <h1>Hello BookLoop</h1>
      <p class="client-type">D2 product home · Python / Jinja</p>

      {% if current_user.is_authenticated %}
        <section class="status-card">
          <h2>Signed in</h2>
          <p>Welcome, <strong>{{ current_user.username }}</strong>.</p>
          <form action="{{ url_for('auth.logout') }}" method="post">
            <button type="submit">Log out</button>
          </form>
        </section>
      {% else %}
        <section class="status-card">
          <h2>Borrower session</h2>
          <p>Sign in before requesting a book.</p>
          <a href="{{ url_for('auth.login') }}">Log in</a>
          <a href="{{ url_for('auth.register') }}">Register</a>
        </section>
      {% endif %}

      <nav class="toc-nav" aria-label="BookLoop development pages">
        <a href="{{ url_for('client_test.index') }}">🧪 Test Hub</a>
        <a href="{{ url_for('jinja_client.jinja_reference') }}">🐍 Jinja Reference</a>
        <a
          href="{{ url_for('jinja_client.product_home') }}"
          title="Reload current page"
          aria-label="Reload current page"
        >↻</a>
      </nav>
    </main>
  </body>
</html>
